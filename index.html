<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ProductPrime" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Social sharing preview -->
    <meta property="og:type" content="website" />
    <!-- og:url intentionally omitted: Facebook/Messenger canonicalizes shared URLs to this value,
         which strips the /Register?ref=CODE path from referral links. Without it, the scraper
         uses the actual shared URL instead. -->
    <meta property="og:title" content="ProductPrime" />
    <meta property="og:description" content="MLM genealogy and referral management platform" />
    <meta property="og:image" content="https://productprime.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ProductPrime" />
    <meta property="og:site_name" content="ProductPrime" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ProductPrime" />
    <meta name="twitter:description" content="MLM genealogy and referral management platform" />
    <meta name="twitter:image" content="https://productprime.vercel.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>ProductPrime</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
