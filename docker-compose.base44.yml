services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
    environment:
      - PGPASSWORD=postgres
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h db -U postgres -f /migrations/000_local_init.sql &&
        psql -h db -U postgres -f /migrations/008_redemption_history.sql &&
        psql -h db -U postgres -f /migrations/010_auto_redeem_server.sql &&
        echo "Migrations complete"

  # Local stand-in for pg_cron: fires the server-side auto-redeem every 30s (it only acts once a day at the admin time)
  scheduler:
    image: postgres:16-alpine
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      - PGPASSWORD=postgres
    entrypoint: ["sh", "-c"]
    command:
      - while true; do psql -h db -U postgres -qAt -c "select public.run_auto_redeem()" >/dev/null 2>&1; sleep 30; done
    restart: on-failure

  api:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - PGRST_DB_URI=postgres://postgres:postgres@db:5432/postgres
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
      - PGRST_DB_SCHEMA=public
      - PGRST_SERVER_PORT=3000

  storage:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./scripts/local-storage.cjs:/app/local-storage.cjs:ro
      - storage_data:/data
    command: ["node", "local-storage.cjs"]
    restart: on-failure

  proxy:
    image: nginx:alpine
    depends_on:
      - api
      - storage
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Local PostgREST fallback — real Supabase is missing the placement_id column.
      # Remove these two lines once the column is added to the real Supabase project.
      - VITE_SUPABASE_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.oSCcZHxRGIuAhvf8EdR5fLbwTPpw4E2nvrAMTbS1TUk
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install && npm run dev"
    depends_on:
      - proxy

volumes:
  db_data:
  storage_data:
