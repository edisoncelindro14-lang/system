server {
    listen 8000;

    location /rest/v1/ {
        # Strip PostgREST's CORS headers to avoid duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';

        # Our CORS headers (single set)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Range, Location' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Strip /rest/v1/ prefix and forward to PostgREST
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/v1/ {
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://storage:3001;
    }
}
